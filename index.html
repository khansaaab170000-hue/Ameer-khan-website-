<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ameer</title>
<meta name="monetag" content="dfbeedbc211e04e62d123df9d3c19a8e">
<style>
body{background:#0a0e13;color:#fff;text-align:center;font-family:Arial;margin:0;padding:0}
.top{background:#00ff88;padding:15px;color:#000;font-weight:bold;font-size:20px}
.box{max-width:400px;margin:auto;padding:15px}
.card{background:#151a21;border:1px solid #222;padding:15px;border-radius:10px;margin-top:15px}
.bal{font-size:50px;color:#00ff88;font-weight:bold}
.btn{background:#00ff88;color:#000;border:none;padding:12px 20px;border-radius:8px;width:100%;font-weight:bold;margin-top:10px;cursor:pointer}
.btn2{background:#222;color:#fff;border:1px solid #444;padding:12px 20px;border-radius:8px;width:100%;font-weight:bold;margin-top:10px;cursor:pointer}
#game{width:100%;height:300px;background:#000;position:relative;overflow:hidden;border-radius:10px;margin-top:15px}
.bubble{position:absolute;width:60px;height:60px;background:#00ff88;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;font-weight:bold;cursor:pointer}
#pop{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center}
.popbox{background:#151a21;border:2px solid #00ff88;padding:20px;border-radius:10px;max-width:300px;width:90%}
input{width:100%;padding:12px;margin:6px 0;box-sizing:border-box;border-radius:8px;border:1px solid #444;background:#222;color:#fff}
</style>
</head>
<body>
<div class="top">Ameer Khan Website</div>
<div class="box">
<div class="card">
<div class="bal" id="bal">0</div>
<p>Coins</p>
<button class="btn" onclick="tap()">TAP TO EARN</button>
<div id="game"></div>
<button class="btn2" onclick="openPop()">Withdraw</button>
</div>
</div>

<div id="pop">
<div class="popbox">
<h3>Withdraw</h3>
<input type="text" placeholder="Enter Easypaisa / JazzCash Number">
<input type="number" placeholder="Coins Amount">
<button class="btn">Submit Request</button>
<button class="btn2" onclick="closePop()">Close</button>
</div>
</div>

<script>
let coins = 0;
function tap(){ coins++; document.getElementById('bal').innerText = coins; }
function openPop(){ document.getElementById('pop').style.display='flex'; }
function closePop(){ document.getElementById('pop').style.display='none'; }
</script>

</body>
</html>
