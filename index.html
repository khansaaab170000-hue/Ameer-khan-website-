<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ameer Khan Bubble Earning</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#0a0e13;color:#fff;text-align:center}.top{background:linear-gradient(90deg,#00ff88,#00ccff);padding:20px;color:#000;font-weight:900;font-size:22px}.box{max-width:450px;margin:auto;padding:15px}.card{background:#151a21;border:1px solid #00ff8855;border-radius:20px;padding:20px;margin:15px 0}.bal{font-size:55px;color:#00ff88;font-weight:900}.btn{background:linear-gradient(90deg,#00ff88,#00ccff);color:#000;border:none;padding:15px;border-radius:50px;font-weight:900;width:100%;margin:10px 0;font-size:18px;cursor:pointer}#game{width:100%;height:380px;background:#10161f;border-radius:20px;position:relative;overflow:hidden;border:2px solid #00ff88}.bubble{position:absolute;width:60px;height:60px;background:radial-gradient(circle at 30% 30%,#00ff88,#00ccff);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;cursor:pointer;animation:pop .2s}@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}</style></head><body><div class="top">💰 AMEER KHAN EARNING HUB 👑</div><div class="box"><div class="card"><div style="color:#888">Balance</div><div class="bal">Rs. <span id="b">250</span></div><div style="color:#00ff88">Har Bubble = Rs.10</div></div><div class="card"><div id="game"></div><button class="btn" onclick="start()">🎮 GAME START KARO</button><button class="btn" style="background:#222;color:#fff" onclick="alert('Mubarak! Rs.'+bal+' JazzCash Withdraw!')">💸 WITHDRAW KARO</button></div></div><script>let bal=250;function start(){document.getElementById('game').innerHTML='';for(let i=0;i<2;i++)addB();setInterval(addB,700)}function addB(){let d=document.createElement('div');d.className='bubble';let gm=document.getElementById('game');d.style.left=Math.random()*(gm.clientWidth-60)+'px';d.style.top=Math.random()*(gm.clientHeight-60)+'px';d.innerText='10';d.onclick=()=>{bal+=10;document.getElementById('b').innerText=bal;d.remove()};gm.appendChild(d);setTimeout(()=>{if(d.parentNode)d.remove()},3000)}</script></body></html>
